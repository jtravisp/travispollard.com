# Crosswalk for the 2026 season (SPEC-phase0 6.1).
#
# canonical_id: project-owned slug, stable forever, vendor-neutral. A vendor
# renaming a team rewrites one line here rather than every historical row.
#
# 266 entries: all 266 teams Sagarin rates, 138 FBS and 128 FCS.
# 234 matched exactly on name via `cfb crosswalk bootstrap`; the other 32 were
# decided by hand from _candidates-2026.yaml. cfbd_id and division on those 32
# were filled from tests/fixtures/rosters/cfbd-2026.json by exact name lookup,
# which is also what test_crosswalk.py cross-checks them against.
#
# Conference is deliberately absent: it is time-varying and belongs in each
# snapshot's parsed output, not in a mapping that a played season freezes.

