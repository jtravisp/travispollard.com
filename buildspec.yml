version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - cd frontend
      - npm ci
      # No --with-deps. This image is Amazon Linux 2023, which has no apt-get,
      # and Playwright's dependency step shells out to it: the run on 2026-08-29
      # died in one second with `apt-get: command not found` and exit 127 --
      # before downloading a single browser, because the dependency step runs
      # first and aborts the whole install.
      #
      # The libraries it would have installed were only ever needed by webkit,
      # which is no longer in the projects list. See playwright.config.ts.
      - npx playwright install

  build:
    commands:
      - npm run build  # next.config.js must include `output: 'export'`

  post_build:
    commands:
      - echo "Running Playwright smoke tests..."
      # CI=true is belt to the config's braces. Playwright reads it to suppress
      # the report server, retry flaky specs, and forbid `test.only`; CodeBuild
      # does not set it, so without this the container looks like a laptop to
      # every tool that checks.
      - CI=true npx playwright test

artifacts:
  base-directory: frontend/out  # This is where `next export` puts static site
  files:
    - "**/*"
  discard-paths: no
  name: BuildArtifact
