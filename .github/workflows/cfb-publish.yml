# SPEC-phase1 §8. Build `/cfb/data/*`, upload, invalidate.
#
# **This is the SLO, and its deadline is first kickoff of the week.** It is the
# one thing in this pipeline that can genuinely be missed, which is what makes
# the alerting mean anything -- every other job has a whole week of slack. There
# is deliberately **no retry-until-it-works loop**: a prediction published after
# kickoff is not a prediction, so a failed run is a red run and an email, and a
# person decides whether it is still worth publishing.
#
# **Thursday 12:30, then Friday 12:00.** The deadline used to read "first kickoff
# Saturday", and a Friday publish met it comfortably. College football does not
# only play Saturdays: week 1 has forty Thursday games and eighteen Friday games,
# and the first kickoff of the season was Thu 27 Aug 22:00 UTC. Friday 12:00 UTC
# lands *fourteen hours after* a Thursday 5:00 PM CDT kickoff, so the first
# publish of the week was already showing finished games as forecasts -- and with
# results only captured on Sunday, they stayed unmarked for two days.
#
# So Thursday is now the publish that has to make the deadline and Friday is a
# refresh for lines that moved. 12:30 is half an hour after `cfb-predict`, the
# same gap `cfb-score` leaves after `cfb-cfbd`, and for the same reason: Actions
# cron drifts 5-15 minutes under load and the margin absorbs it.
#
# **This does not cover a Tuesday.** November MACtion plays Tuesday and Wednesday
# nights, which are inside the same CFBD week and roughly 36 hours *before* the
# Thursday run. Meeting the deadline literally in those weeks needs a Monday or
# Tuesday publish; that is recorded in PHASE-1 rather than guessed at here.
#
# **It publishes what `cfb-predict.yml` wrote the day before**, and it takes the
# newest generation of that week -- unlike `cfb score`, which takes the newest
# one written *before* kickoff. The two want opposite things and both are right:
# a regenerate exists because someone wanted the newer number on the site, while
# grading it would claim a forecast made with the results in hand.
#
# The CloudFront invalidation is part of the command, not a step here. It is
# logged separately from the upload because the upload is what makes the numbers
# exist and the invalidation only makes them visible sooner -- a failure of the
# second is a slow page, not a wrong one, and a Friday run has to be readable on
# that distinction at a glance.
name: cfb-publish

on:
  schedule:
    # Thursday is the one that has to make the deadline; Friday refreshes lines.
    - cron: "30 12 * * 4" # Thursday 12:30 UTC, after cfb-predict
    - cron: "0 12 * * 5" # Friday 12:00 UTC
  workflow_dispatch:
    inputs:
      week:
        description: "Week to publish (1-15). Blank uses the coming week."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: cfb

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # --extra s3 covers all three AWS boundaries this job crosses: the store,
      # the SSM read for the distribution id, and the CloudFront invalidation.
      - name: Install
        run: uv sync --extra s3

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::679878703800:role/cfb-data-publisher
          aws-region: us-east-1

      # Same week default as `cfb predict`, and that is not a coincidence:
      # Thursday's forecast and Friday's page are two halves of one week, so a
      # publish that resolved the week differently would put a slate on the site
      # that nobody generated.
      - name: Build and upload /cfb/data/*
        run: |
          uv run cfb publish ${{ inputs.week && format('--week {0}', inputs.week) || '' }}

      # The SLO check, from the outside. The command above can succeed against
      # the bucket while the CDN still serves a stale or missing object -- a
      # behaviour misconfigured, an invalidation that silently did nothing -- and
      # the whole point of Friday is that the site is right before kickoff. So
      # this asks the way a reader would.
      - name: Confirm the site is serving what was just published
        run: |
          for doc in next-game slate accuracy; do
            url="https://travispollard.com/cfb/data/$doc.json"
            code=$(curl -sS -o /tmp/$doc.json -w '%{http_code}' "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url returned $code"; exit 1; }
            python -c "import json,sys; json.load(open('/tmp/$doc.json'))" \
              || { echo "::error::$url is not valid JSON"; exit 1; }
          done
