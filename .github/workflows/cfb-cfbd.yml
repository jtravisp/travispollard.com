# SPEC-phase0 §11. Pull the completed week's CFBD data.
#
# Sunday 12:00 UTC is 07:00 CT, hours after the last West Coast game goes final.
#
# **NOT RUNNABLE YET — two CLI gaps, both tracked in PHASE-0 §7.** The schedule
# is deliberately the only thing commented out, so this file is the shape the
# workflow takes and not a guess at it:
#
#   1. `cfb fetch cfbd --resource games` requires an explicit `--week`. Supplying
#      it from here means the workflow computing "the week that just completed",
#      which is calendar arithmetic that already exists in `calendar.py` and must
#      not be reimplemented in YAML where nothing tests it.
#   2. `fetch cfbd` has no `in_season` guard. `fetch sagarin` has one; this one
#      was left out on the reading that SPEC §8 gives cfbd no `--force`. §11
#      wants both collect workflows gated, so the guard belongs in the CLI.
#
# Both are one-line-shaped changes to `cli.py` that need tests, and tests are not
# written in an implementation session. Until they land, a scheduled run here
# would fail on a usage error rather than collect anything, so it does not run.
name: cfb-cfbd

on:
  # schedule:
  #   - cron: "0 12 * * 0"   # Sunday 12:00 UTC -- restore once the CLI gaps close
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: cfb

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # --extra s3: both the default s3:// store and nothing else. `fetch cfbd`
      # reads its key from SSM through boto3 as well (SPEC §5.5), so this job
      # needs the extra twice over.
      - name: Install
        run: uv sync --extra s3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::679878703800:role/cfb-data-publisher
          aws-region: us-east-1

      # No --week. The completed week is the CLI's to work out from the committed
      # calendar; a `--week ${{ ... }}` expression here would be the duplicated
      # arithmetic this workflow exists to avoid.
      - name: Fetch games
        run: uv run cfb fetch cfbd --resource games

      - name: Fetch lines
        run: uv run cfb fetch cfbd --resource lines
