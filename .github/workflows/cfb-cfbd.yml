# SPEC-phase0 §11. Pull the completed week's CFBD data.
#
# Sunday 12:00 UTC is 07:00 CT, hours after the last West Coast game goes final.
#
# **Every step is a command a human runs locally**, same as `cfb-sagarin.yml`.
# The two things that used to keep this file's cron commented out now live in the
# CLI, where they are tested, rather than in YAML, where they would not be:
#
#   1. `--week` defaults to the week that just completed, from the committed
#      calendar (`calendar.last_completed_week`). No date arithmetic here.
#   2. `fetch cfbd` gates on `in_season` and exits 0 when false, matching
#      `fetch sagarin`.
#
# **The season's first two Sundays collect nothing, and that is correct.** Week 1
# runs 2026-08-29 to 2026-09-08, so no week has completed before September 13.
# The CLI exits 0 with `reason=no_completed_week` and the run stays green --
# turning those Sundays red would train a reader to ignore the one that matters.
name: cfb-cfbd

on:
  schedule:
    - cron: "0 12 * * 0" # Sunday 12:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: cfb

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # --extra s3: both the default s3:// store and nothing else. `fetch cfbd`
      # reads its key from SSM through boto3 as well (SPEC §5.5), so this job
      # needs the extra twice over.
      - name: Install
        run: uv sync --extra s3

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::679878703800:role/cfb-data-publisher
          aws-region: us-east-1

      # No --week: the CLI works it out from the committed calendar. A
      # `--week ${{ ... }}` expression here would be the duplicated arithmetic
      # this workflow exists to avoid.
      - name: Fetch games
        run: uv run cfb fetch cfbd --resource games

      - name: Fetch lines
        run: uv run cfb fetch cfbd --resource lines
