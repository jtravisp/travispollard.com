# SPEC-phase1 §8. Thursday: write the coming week's predictions.
#
# 12:00 UTC on Thursday, ahead of the week's first kickoff. That ordering is the
# whole point of the file and it is enforced twice over: this job runs before the
# games, and `cfb score` will later refuse to grade any generation stamped after
# its own slate had started (SPEC-phase1 §5.4). A prediction published after
# kickoff is not a prediction, and neither half of the pipeline will pretend
# otherwise.
#
# **Thursday rather than Friday, and the gap is deliberate.** `cfb-publish.yml`
# runs Friday and is the SLO; putting generation a day ahead of publication means
# a bad Thursday can be re-run by hand with a whole day in reserve, instead of
# turning the deadline itself into the first place a problem shows up.
#
# **Re-running is safe and is the intended repair.** Prediction objects are
# write-once (§4.1): a second run writes a new key beside the first and the
# publish step takes the newest that still precedes kickoff. Nothing is
# overwritten and nothing is lost, so "run it again" is always available.
name: cfb-predict

on:
  schedule:
    - cron: "0 12 * * 4" # Thursday 12:00 UTC
  workflow_dispatch:
    inputs:
      week:
        description: "Week to predict (1-15). Blank uses the coming week."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: cfb

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra s3

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::679878703800:role/cfb-data-publisher
          aws-region: us-east-1

      # **The market lines for the week about to be forecast, and this is the
      # only job that captures them.**
      #
      # `--resource lines` had exactly one fetcher -- `cfb-score.yml`, which
      # resolves `last_completed_week` -- and exactly one reader, `predict_week`,
      # which wants the *coming* week. Producer and consumer were a week apart, so
      # Monday archived the lines of a week already played and Thursday found
      # nothing for the week it was forecasting. Weeks 1 and 2 of 2026 had lines
      # only because of manual fetches during bring-up (22:34Z and 04:19Z, matching
      # no cron); week 3 was the first with neither, and published 0 of 119 games
      # priced. The market column of the bake-off had been quietly emptying since
      # `cfb-cfbd.yml` was folded into `cfb-score.yml` -- the games pull found a
      # correct home there and the lines pull came along and lost its purpose.
      #
      # A step rather than a job, for the reason SPEC-phase1 §8.3 gives: two jobs
      # a few minutes apart are not ordered, and a forecast written before its
      # lines landed is one with an empty benchmark and nothing saying so.
      #
      # `--in-progress` resolves `coming_week`, the same week `cfb predict` below
      # resolves. Out of season, and past the last regular week, it exits 0 with a
      # reason rather than failing.
      - name: Fetch the coming week's market lines
        run: uv run cfb fetch cfbd --resource lines --in-progress

      # No `--week` on the scheduled path: `calendar.coming_week` is the mirror
      # of the `last_completed_week` that `cfb-cfbd.yml` and `cfb-score.yml`
      # already use, and it lives in tested Python rather than in a cron
      # expression.
      #
      # Past the last regular week this exits 0 with `reason=no_coming_week`
      # rather than failing. Nothing is ahead to predict in December, and a red
      # run every Thursday of the bowl season would bury a real one.
      - name: Generate the coming week's predictions
        run: |
          uv run cfb predict ${{ inputs.week && format('--week {0}', inputs.week) || '' }}
